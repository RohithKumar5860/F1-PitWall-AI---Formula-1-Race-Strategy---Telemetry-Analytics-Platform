version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: f1_pitwall_postgres
    restart: always
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: f1password
      POSTGRES_DB: f1_pitwall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1user -d f1_pitwall"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_pitwall_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://f1user:f1password@postgres:5432/f1_pitwall
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FASTF1_CACHE_DIR=data/cache
    volumes:
      - ./data:/app/data
      - ./trained_models:/app/trained_models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: f1_pitwall_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
