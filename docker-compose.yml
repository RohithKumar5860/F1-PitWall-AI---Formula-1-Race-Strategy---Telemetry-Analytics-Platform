version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: f1_pitwall_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
      POSTGRES_DB: ${POSTGRES_DB:-f1_pitwall}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1user} -d ${POSTGRES_DB:-f1_pitwall}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_pitwall_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-f1user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-f1_pitwall}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FASTF1_CACHE_DIR=data/cache
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY env var is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    volumes:
      - ./data:/app/data
      - ./trained_models:/app/trained_models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: f1_pitwall_frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
